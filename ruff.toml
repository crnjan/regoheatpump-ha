# Oldest Python among the supported Home Assistant versions (see hacs.json)
target-version = "py314"

[lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # import sorting
    "UP", # modern Python syntax
    "B",  # likely bugs
]
# Line length is handled by the formatter
ignore = ["E501"]

[lint.isort]
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["custom_components"]
